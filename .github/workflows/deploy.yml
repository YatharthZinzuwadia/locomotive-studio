name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure GitHub Pages
        run: |
          node -e "
          const fs = require('fs');
          const path = 'next.config.ts';
          let config = fs.readFileSync(path, 'utf8');

          config = config.replace(
            'const nextConfig: NextConfig = {};',
            \`const nextConfig: NextConfig = {
              output: 'export',
              basePath: '/locomotive-studio',
              assetPrefix: '/locomotive-studio/',
              images: {
                unoptimized: true,
              },
            };\`
          );

          fs.writeFileSync(path, config);
          "

      - name: Build
        run: yarn build

      - name: Verify export
        run: |
          if [ ! -d "./out" ]; then
            echo "ERROR: ./out directory was not generated."
            exit 1
          fi

          echo "Static export generated successfully."
          ls -la ./out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4